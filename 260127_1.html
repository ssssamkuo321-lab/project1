<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習</title>
        <style>
            .box{
                width: 300px;
                height: 300px;
                background-color: #7bd6d2;
                border-radius: 10px;
                box-shadow: 2px 2px 2px 2px #324153;

                box-sizing: border-box;

                color: #f5e3e3;
                font-size: 30px;
                text-align: center;
                line-height: 300px;

                margin: 30px;
            }

            .box:hover{
                background-color: #d8b169;
                font-size: 40px;
                box-shadow: 4px 4px 4px 4px #262c35;
                transform: scale(1.05);
                transition: transform 0.5s;
            }


        </style>


</head>
<body>
    <div class="box">boxA</div>

    <div class="box">boxB</div>

    <div class="box">boxC</div>

</body>
</html>
