<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <title>表格2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/css_1.css">

    <style>
        @media screen and (max-width: 768px) {
            .table-rwd thead {
                display: none;
            }

            .table-rwd tbody tr {
                display: block;
                border: solid var(--mycolor05);
                margin-top: 10px;
            }

            .table-rwd tbody tr {
                display: flex;
                flex-direction: column;
                /* 保持垂直排列 */
            }

            .table-rwd tbody tr td {
                display: block;
                /* overflow: hidden; */

            }

            .table-rwd tbody tr td::before {
                content: attr(data-th) "：";
                font-size: 20px;
                font-weight: 900;
                float: left;
                width: 30%;
                text-align: right;
                padding-right: 1em;
            }

            .table-rwd tbody tr td[data-th="商品圖片"] {
                order: -1;
                /* 負數會讓它排在所有 0 (預設值) 之前 */
            }

            .table-rwd tbody tr td[data-th="商品編號"] {
                order: 0;
            }

            .table-rwd tbody tr td span{
                display: block;
                float: left;
                width: 70%;
            }
             
        }
    </style>

</head>
