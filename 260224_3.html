<!DOCTYPE html>
<html lang="zh.TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古電玩觀光指南 - 文字強化版</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/css_1.css">
    <style>
        :root {
            --pixel-border: #333;
            --panel-bg: rgba(255, 255, 255, 0.95); /* 加強背板不透明度 */
            --accent-color: #007bff;
        }

        body {
            background-color: #f8f9fa;
            image-rendering: pixelated;
        }

        /* 統一硬邊邊框 */
        .bg-cover {
            background-position: center center;
            background-size: cover;
            border: 4px solid var(--pixel-border);
        }

        /* --- 捲軸遮罩與文字背板強化 --- */
        .rollert { position: relative; overflow: hidden; }
        
        .rollert_box {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); /* 淡淡的底色 */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s steps(4);
            z-index: 5;
            padding: 15px;
        }

        /* 文字背板容器 */
        .text-panel {
            background: var(--panel-bg);
            border: 3px solid var(--pixel-border);
            padding: 15px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            color: #000 !important; /* 強制黑字 */
            width: 90%;
        }

        .rollert:hover .rollert_box { opacity: 1; }

        /* --- 中央主視窗特效 --- */
        .main-monitor {
            position: relative;
            overflow: hidden;
            border: 6px solid var(--pixel-border);
        }

        /* 掃描線動畫 */
        .main-monitor::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255, 255, 255, 0.3);
            animation: scanline 8s linear infinite;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* 震動效果 */
        .box-glitch:hover { animation: glitch 0.2s infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            50% { transform: translate(-2px, 1px); }
            100% { transform: translate(2px, -1px); }
        }

        /* 底部按鈕區 */
        .btn01 {
            text-align: center;
            line-height: 250px;
            font-weight: 900;
        }
        .btn01 a {
            text-decoration: none;
            color: #fff;
            background: var(--pixel-border);
            padding: 10px 20px;
            border: 4px outset #999;
            white-space: nowrap;
        }
        .btn01 a:hover { background: var(--accent-color); border-style: inset; }

        /* 修正高度排版 */
        .vh-100 { min-height: 100vh; }
        .h-50 { height: calc(50% - 8px) !important; } /* 扣除 gap 的高度 */

    </style>
</head>
