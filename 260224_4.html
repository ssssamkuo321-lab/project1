<!DOCTYPE html>
<html lang="zh.TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間軸排版</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/css_1.css">
    <style>
        .pimg {
            height: 260px;
        }

        .bg-cover {
            background-position: center center;
            background-size: cover;
        }


        .timeline-section {
            position: relative;
        }

        .timeline-section::before {
            position: absolute;
            content: "";
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: var(--mycolor05);
            left: 50%;
            transform: translateX(-50%);
        }

        .timeline-section-pointer {
            position: relative;
        }

        .timeline-section-pointer::before {
            position: absolute;
            content: "";
            width: 18px;
            height: 18px;
            background-color: var(--mycolor08);
            border-radius: 50%;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
            border: 3px solid var(--mycolor07);
        }

        .timeline-section-pointer:hover:before{
            width: 24px;
            height: 24px;
        }


        @media screen and (max-width: 768px) {
            .timeline-section::before{
                display: none;
            }

            .timeline-section-pointer::before{
                display: none;
            }

        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="timeline-section">
