<!DOCTYPE html>
<html lang="zh.TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11.表單</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/css_1.css">
</head>

<body>
    <div class="container pb-5">
        <div class="title-01 p-3 my-4 fw-400 text-danger">11.表單相關應用</div>

        <div class="title-03 p-3 my-4 fw-400 text-secondary">1.表單樣式</div>
        <div class="row">
            <div class="col-12">
                <form id="myForm">
                    <div class="mb-3">
                        <label for="" class="form-label">帳號</label>
                        <input type="text" class="form-control" id="username01" placeholder="帳號字數1~6">
                        <div class="valid-feedback">輸入符合規定</div>
                        <div class="invalid-feedback">輸入不符合規定</div>
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="password01" placeholder="密碼字數2~8">
                        <div class="valid-feedback">輸入符合規定</div>
                        <div class="invalid-feedback">輸入不符合規定</div>
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email01" placeholder="信箱字數2~10">
                        <div class="valid-feedback">輸入符合規定</div>
                        <div class="invalid-feedback">輸入不符合規定</div>
                    </div>
                    <button type="submit" class="btn btn-primary">送出</button>
                </form>
            </div>
        </div>

        <hr class="my-5">
        <div class="title-03 p-3 my-4 fw-400 text-secondary">2.表單樣式(不使用form)</div>
        <div class="row">
            <div class="col-12">
                <form id="myForm">
                    <div class="mb-3">
                        <label for="" class="form-label">帳號</label>
                        <input type="text" class="form-control" id="username02" placeholder="帳號字數1~6">
                        <div class="valid-feedback">輸入符合規定</div>
                        <div class="invalid-feedback">輸入不符合規定</div>
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="password02" placeholder="密碼字數2~8">
                        <div class="valid-feedback">輸入符合規定</div>
                        <div class="invalid-feedback">輸入不符合規定</div>
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email02" placeholder="信箱字數2~10">
                        <div class="valid-feedback">輸入符合規定</div>
                        <div class="invalid-feedback">輸入不符合規定</div>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn02">送出</button>
                </form>
            </div>
        </div>

        <hr class="mt-5">
        <div class="title-03 text-secondary">3. select</div>
        <div class="row">
            <div class="col-12">
                <select name="" id="mycity" class="form-select form-select-lg">
                    <option value="" class="text-center" disabled selected>*****請選擇*****</option>
                    <option value="123">123xxxx</option>
                    <option value="456">465xxxx</option>
                    <option value="789">789xxxx</option>
                </select>
            </div>
        </div>


        <div class="title-03 text-secondary">點餐選單練習(select) ai生成</div>
        <div class="row">
            <div class="col-12">
                <select name="" id="mycity01" class="form-select form-select-lg">
                    <option value="" class="text-center" disabled selected>*****請選擇*****</option>
                    <option value="紅燒牛肉麵01"></option>
                    <option value="紅燒牛肉麵02"></option>
                    <option value="紅燒牛肉麵03"></option>
                </select>
            </div>
        </div>


        <hr class="mt-5">
        <div class="title-03 py-3 text-secondary">4. range</div>
        <div class="row">
            <div class="col-12">
                <label for="form-label">
                    數量:<span class="text-success h2 fw-900" id="num_text">50</span>個
                </label>
                <input type="range" class="form-range" id="num" min="0" max="100" step="1">
            </div>
        </div>

        <!-- 資料串接後端推薦熱門美食 -->
        <hr class="mt-5">
        <div class="title-03 py-3 text-secondary">5. datalist(資料串接後端推薦熱門美食)</div>
        <div class="row">
            <div class="mb-3">
                <label for="" class="form-label">美食紀錄</label>
                <input type="text" class="form-control" list="foodlist">
                <datalist id="foodlist">
                    <option value="牛肉麵"></option>
                    <option value="炒飯"></option>
                    <option value="漢堡"></option>
                    <option value="可樂"></option>
                </datalist>
            </div>
        </div>

        <hr class="mt-5">
        <div class="title-03 py-3 text-secondary">6.checkbox(複選)</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" name="sport" id="" value='跑步' class="form-check-input">
                    <label for="" class="form-check-label">跑步</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="sport" id="" value='游泳' class="form-check-input">
                    <label for="" class="form-check-label">游泳</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="sport" id="" value='爬山' class="form-check-input">
                    <label for="" class="form-check-label">爬山</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="sport" id="" value='重訓' class="form-check-input">
                    <label for="" class="form-check-label">重訓</label>
                </div>
                <button type="button" class="btn btn-success my-3" id="btn06">確認</button>
            </div>

        </div>

        <hr class="mt-5">
        <div class="title-03 py-3 text-secondary">7.radio(單選)</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check">
                    <input type="radio" name="edu" id="" value='研究所' class="form-check-input">
                    <label for="" class="form-check-label">研究所</label>
                </div>
                <div class="form-check">
                    <input type="radio" name="edu" id="" value='大學' class="form-check-input">
                    <label for="" class="form-check-label">大學</label>
                </div>
                <div class="form-check">
                    <input type="radio" name="edu" id="" value='高中職' class="form-check-input">
                    <label for="" class="form-check-label">高中職</label>
                </div>
                <div class="form-check">
                    <input type="radio" name="edu" id="" value='其他' class="form-check-input">
                    <label for="" class="form-check-label">其他</label>
                </div>

                <button type="button" class="btn btn-success my-3" id="btn07">確認</button>
            </div>

        </div>

        <hr class="mt-5">
        <div class="title-03 py-3 text-secondary">8.floating</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 form-floating">
                    <input type="text" class="form-control" name="" id="" placeholder="">
                    <label for="" class="form-label">帳號</label>
                </div>
            </div>

        </div>

    </div>

    <script src="css/bootstrap.bundle.min.js"></script>
    <script src="css/jquery-4.0.0.js"></script>
    <script>

        //公有變數
        let flag_username01 = false;
        let flag_password01 = false;
        let flag_email01 = false;

        let flag_username02 = false;
        let flag_password02 = false;
        let flag_email02 = false;
        //主程式
        $(function () {
            //1.表單樣式
            $("#myForm").submit(function (e) {
                if (flag_username01 && flag_password01 && flag_email01) {
                    e.preventDefault();
                    console.log("form觸發!!!!!!!!!!");
                    console.log($("#username01").val());
                    console.log($("#password01").val());
                    console.log($("#email01").val());
                } else {
                    e.preventDefault();
                    alert("欄位有錯誤, 請修正");
                }


            });

            $("#username01").blur(function () {
                //console.log($(this).val().length);
                if ($(this).val().length > 0 && $(this).val().length < 7) {
                    //符合規定
                    $(this).removeClass("is-invalid").addClass("is-valid");
                    flag_username01 = true;
                } else {
                    //不符合規定
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    flag_username01 = false;
                }

            });

            $("#password01").blur(function () {
                if ($(this).val().length > 1 && $(this).val().length < 9) {
                    $(this).removeClass("is-invalid").addClass("is-valid");
                    flag_password01 = true;
                } else {
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    flag_password01 = false;
                }

            });

            $("#email01").blur(function () {
                if ($(this).val().length > 1 && $(this).val().length < 11) {
                    $(this).removeClass("is-invalid").addClass("is-valid");
                    flag_email01 = true;
                } else {
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    flag_email01 = false;
                }

                    alert("欄位有錯誤, 請修正");

            });

                    $(this).removeClass("is-valid").addClass("is-invalid");

            });

            $("#password02").blur(function () {

                    $(this).removeClass("is-invalid").addClass("is-valid");

                    $(this).removeClass("is-valid").addClass("is-invalid");

            });

            $("#email02").blur(function () {
                if ($(this).val().length > 1 && $(this).val().length < 11) {
                    $(this).removeClass("is-invalid").addClass("is-valid");
                    flag_email02 = true;
                } else {
                    $(this).removeClass("is-valid").addClass("is-invalid");
                    flag_email02 = false;
                }
            });



            //3. select
            $("#mycity").change(function () {
                console.log($(this).val());
            });

                }
            ];

            $("#mycity01").empty();
            $("#mycity01").append(`<option value="" class="text-center" disabled selected>*****請選擇*****</option>`);

            fooddata.forEach(function (item) {
                // console.log(item.name);
                let strHTML = `<option value="${item.name}">${item.name}</option>`;
                $("#mycity01").append(strHTML);
            });
            $("#mycity01").change(function () {
                console.log($(this).val());
            })


            //4.range監聽
            $("#num").on("input", function () {
                console.log($(this).val());
                $("#num_text").text($(this).val());
            })


            //6.checkbox(複選)
            //初始值設定
            $("input[name='sport'][value='跑步']").prop("checked", true);
            $("input[name='sport'][value='游泳']").prop("checked", true);
            $("input[name='sport'][value='爬山']").prop("checked", true);
            $("input[name='sport'][value='重訓']").prop("checked", true);

            $("#btn06").click(function () {
                let result = [];



                $("input[name='sport']:checked").each(function () {
                    console.log($(this).val());
                    result.push($(this).val());
                });

                if (result.length == 0) {
                    alert("至少選擇一個運動");
                } else {
                    console.log(result);
                }

            });

            //7.radio(單選)

            $("input[name='edu'][value='其他']").prop("checked", true);

            $("#btn07").click(function () {
                let result = [];

                $("input[name='edu']:checked").each(function () {
                    console.log($(this).val());
                    result.push($(this).val());
                });

    </script>
</body>

</html>
