    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/css_1.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-900 text-warning" href="#">CRUD</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#">首頁</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            產品維護
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item active" href="260310_CRUD_index.html">新增產品</a></li>
                            <li><a class="dropdown-item " href="260310_CRUD_showtable.html">產品列表</a></li>
                            <li><a class="dropdown-item " href="260402.html">flask.api</a></li>

                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />

    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-10 mt-5">
                <div class="display-4 fw-900 text-center position-relative" style="min-height: 80px;">
                    <!-- 使用 top-n1 (或自定義負 margin) 向上推，不影響容器高度 -->
                    <div class="position-relative" style="top: -10px;">
                        練習表單
                    </div>
                    <button class="btn btn-outline-secondary position-absolute end-0 bottom-0" data-bs-toggle="modal"
                        data-bs-target="#addModal">
                        新增
                    </button>
                </div>

                <table class="table table-bordered shadow-sm ">
                    <thead class="table-dark">
                        <th class="col-2">編號</th>
                        <th class="col-3">品名</th>
                        <th class="col-3">價格</th>
                        <th class="text-center col-2">按鈕</th>
                    </thead>
                    <tbody id="mybody">
                        <tr>
                            <td>xxx</td>
                            <td>xxx</td>
                            <td>xxx</td>
                            <td>xxx</td>
                            <td class="text-center">
                                <button class="btn btn-outline-secondary " data-bs-toggle="modal"
                                    data-bs-target="#addModal">新增</button>
                                <button class="btn btn-outline-warning " data-bs-toggle="modal"
                                    data-bs-target="#updateModal">更新</button>
                                <button class="btn btn-danger">刪除</button>
                            </td>
                        </tr>
                    </tbody>
            </div>
        </div>

        <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header text-bg-warning ">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">新增產品</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="pname" class="form-label">品名</label>
                            <input type="text" class="form-control" placeholder="品名" id="pname">
                        </div>
                        <div class="mb-3">
                            <label for="pprice" class="form-label">價格</label>
                            <input type="number" class="form-control" placeholder="數字" id="pprice">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="add_btn">確認新增</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header text-bg-warning ">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">產品更新</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="pname" class="form-label">品名</label>
                            <input type="text" class="form-control" placeholder="品名" id="pname1">
                        </div>
                        <div class="mb-3">
                            <label for="pprice" class="form-label">價格</label>
                            <input type="text" class="form-control" placeholder="數字" id="pprice1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="updateBtn">確認更新</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="css/bootstrap.bundle.min.js"></script>
    <script src="css/jquery-4.0.0.js"></script>

    <script>
        let uid = "";
        let productData = [];

        $(function () {
            loadProducts();
            function loadProducts() {
                $.ajax({
                    type: "GET",
                    url: "http://127.0.0.1:5000/products",
                    dataType: "json",
                    success: function (data) {
                        console.log(data);

                        productData = data;

                        renderTable(productData);
                    },
                    error: function (res) {
                        console.log(res.responseJSON);
                        Swal.fire({
                            title: "讀取失敗",
                            text: "api連結失敗: http://127.0.0.1:5000/products",
                            icon: "error"
                        });
                    }
                });
            }

            $("#add_btn").off("click").on("click", function () {

                let jsonData = {
                    "name": $("#pname").val(),
                    "price": Number($("#pprice").val())
                };
                console.log(JSON.stringify(jsonData));

                $.ajax({
                    type: "POST",
                    url: "http://127.0.0.1:5000/products",
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify(jsonData),
                    dataType: "json",
                    success: function (data) {

                        loadProducts();
                        Swal.fire({
                            title: "新增成功",
                            showDenyButton: false,
                            showCancelButton: false,
                            icon: "success",
                            confirmButtonText: "確認",
                            denyButtonText: `Don't save`
                        }).then((result) => {
                            if (result.isConfirmed) {
                                //移動路徑 自己=重整
                                location.href = "260407.html";
                            }
                        });

                    },
                    error: function (res) {
                        let msg = res.responseJSON ? res.responseJSON.message : "發生錯誤";
                        Swal.fire({
                            title: "讀取失敗",
                            text: "api連結失敗: http://127.0.0.1:5000/products",
                            icon: "error"
                        });
                    }
                });
            });



            $(document).on("click", ".deleteBtn", function () {

                Swal.fire({
                    title: "確認刪除??",
                    showDenyButton: true,
                    showCancelButton: false,
                    icon: "question",
                    confirmButtonText: "確認",
                    denyButtonText: `取消`
                }).then((result) => {
                    if (result.isConfirmed) {
                        let delete_id = $(this).data("id");

                        //傳遞至後端api 執行刪除
                        $.ajax({
                            type: "DELETE",
                            url: `http://127.0.0.1:5000/products/${delete_id}`,
                            contentType: "application/json; charset=utf-8",
                            dataType: "json",
                            success: function (data) {
                                //console.log(data);
                                location.href = "260407.html"
                            },
                            error: function (res) {
                                console.log(res.responseJSON);
                                Swal.fire({
                                    title: "刪除失敗",
                                    text: "api連結失敗: http://127.0.0.1:5000/products/${delete_id}",
                                    icon: "error"
                                });
                            }
                        });
                    } else if (result.isDenied) {
                        return;
                    }
                });

            });

            $(document).on("click", ".updateBtn", function () {
                //放到model表單
                uid = $(this).data("id");
                $("#pname1").val($(this).data("name"));
                $("#pprice1").val($(this).data("price"));

            });

            $("#updateBtn").click(function () {
                if (1) {

                    let pname = $("#pname1").val();
                    let pprice = Number($("#pprice1").val());

                    console.log(pprice);

                    //傳遞至後端api 執行更新行為 PATCH /post/:id
                    $.ajax({
                        type: "PUT",
                        url: `http://127.0.0.1:5000/products/${uid}`,
                        contentType: "application/json; charset=utf-8",
                        //前面為欄位名稱 後面為值
                        data: JSON.stringify({ name: pname, price: pprice }),
                        success: function (data) {
                            console.log(data);
                            console.log("更新成功");

                            Swal.fire({
                                title: "更新成功",
                                showDenyButton: false,
                                showCancelButton: false,
                                icon: "success",
                                confirmButtonText: "確認",
                                denyButtonText: `Don't save`
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    //移動路徑 自己=重整
                                    location.href = "260407.html";
                                }
                            });

                        },
                        error: function (res) {
                            console.log(res.responseJSON);
                            Swal.fire({
                                title: "更新失敗",
                                text: "api連結失敗: http://127.0.0.1:5000/products/${uid}",
                                icon: "error"
                            });
                        }
                    });
                } else {
                    //欄位有錯誤 用sweetalert顯示提醒
                    Swal.fire({
                        title: "欄位有錯誤,請修正!",
                        showDenyButton: false,
                        showCancelButton: false,
                        icon: "error",
                        confirmButtonText: "確認",
                        denyButtonText: `Don't save`
                    }).then((result) => {
                        if (result.isConfirmed) {
                            return;
                        }
                    });
                }
            });

        });


        function renderTable(data) {
            $("#mybody").empty();
            let list = Array.isArray(data) ? data : (data.products || []);
            list.forEach(function (item) {
                let strHTML = `<tr>
                            <td>${item.id}</td>
                            <td>${item.name}</td>
                            <td>${item.price}</td>
                            <td class="text-center">
                                <button class="btn btn-outline-warning updateBtn" data-bs-toggle="modal" data-bs-target="#updateModal" 
                                data-id="${item.id}" 
                                data-name="${item.name}"
                                data-price="${item.price}"
                                >更新</button>
                                <button class="btn btn-danger deleteBtn"  data-id="${item.id}">刪除</button>
                            </td>
                        </tr>`;
                $("#mybody").append(strHTML);
            });
        };
    </script>

</body>



</html>
