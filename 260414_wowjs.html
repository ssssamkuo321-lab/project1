<!DOCTYPE html>
<html lang="zh.TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/css_1.css">
    <link rel="stylesheet" href="css/animate.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .box01 {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <div class="container mt-5 vh-100">
        <i class="fa-solid fa-heart-crack fa-6x text-danger wow animate__heartBeat" data-wow-duration="2s" data-wow-delay="0s" data-wow-iteration="infinite"></i>
    </div>

    <div class="container mt-5 vh-100">
        <div class="box01 bg-danger wow animate__animated animate__rubberBand" data-wow-duration="5s" data-wow-delay="0s" data-wow-iteration="2"></div>
    </div>

    <div class="container mt-5 vh-100">
        <div class="box01 bg-primary wow animate__animated animate__headShake" data-wow-duration="5s" data-wow-delay="0s" data-wow-iteration="2"></div>
    </div>

    <div class="container mt-5 vh-100">
        <div class="box01 bg-secondary wow animate__animated animate__backOutRight" data-wow-duration="5s" data-wow-delay="0s" data-wow-iteration="2"></div>
    </div>





    <script src="css/bootstrap.bundle.min.js"></script>
    <script src="css/jquery-4.0.0.js"></script>
    <script src="css/wow.min.js"></script>
    <script>
        new WOW().init();
    </script>
</body>

</html>
